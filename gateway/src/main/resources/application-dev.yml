server:
  port: 8888

spring:
  cloud:
    gateway:
      routes:
        # 用户服务路由（通过 /api/userservice/** 访问，开发环境直连 8082）
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/userservice/**
          filters:
            - StripPrefix=1
        # 职位服务路由
        - id: job-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/job/**
          filters:
            - StripPrefix=1
        # 公司服务路由（与 job-service 同一个应用，只是单独映射前缀方便前端调用）
        - id: company-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/company/**
          filters:
            - StripPrefix=1

# 日志配置
logging:
  level:
    root: INFO
    org.example: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

