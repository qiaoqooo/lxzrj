server:
  port: 8082

spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/boss_employment?useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root

upload:
  # 附件简历保存目录，使用绝对路径，避免指向 Tomcat 临时目录
  resume-dir: D:/JavaProject/m_boss直聘/lxzrj/uploads/resume

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # SQL 日志打印
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键生成策略：AUTO（数据库自增）
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # Mapper XML 文件位置
  mapper-locations: classpath:mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: org.example.userservice.entity

# 日志配置
logging:
  level:
    root: INFO
    org.example: DEBUG
    org.example.userservice.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

wx:
  appid: wx303eb92896ac958f
  secret: 4d2cc98b291990d53a9e0dcb1a86c520
  # 关闭测试模式，使用微信真实登录
  test-mode: false

